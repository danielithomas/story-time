[package]
name = "story-time-core"
description = "Reads and writes a bookshelf of plain-Markdown stories: projects, word counts, writing history, checks and compiling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
deunicode = "1"
dirs = "7"
getrandom = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
yaml-rust2 = "0.13"
# Backups are zip files: only pure-Rust deflate is needed.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true
